[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpulse-ai"
version = "0.1.0"
description = "AI fleet operations intelligence for shared micromobility"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "streamlit>=1.38,<2"
]

[project.scripts]
fleetpulse = "fleetpulse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
